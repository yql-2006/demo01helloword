# 服务端口与项目访问路径
server.port=8092
server.servlet.context-path=/jd

# Redis配置
spring.redis.host=192.168.152.142
spring.redis.port=6379
spring.redis.database=0
#spring.redis.password=yourpassword
spring.redis.timeout=10000

# MySQL数据源配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_db?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# JPA配置
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=mysql

# MyBatis配置
mybatis.type-aliases-package=com.wzx.demo01helloword.bean2
mybatis.mapper-locations=classpath:com.wzx.demo01helloword.mapper/*.xml
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl